[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortext"
version = "1.2.4"
description = "Turnkey Python bindings for Cortext — ships multi-arch natives and AIST model chunks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "augmem" }]
keywords = ["memory", "retrieval", "embeddings", "llm", "agents", "cortext"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/augmem/cortext"
Repository = "https://github.com/augmem/cortext.py"
Issues = "https://github.com/augmem/cortext.py/issues"
Releases = "https://github.com/augmem/cortext.cpp/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "wheel>=0.43"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=8",
    "wheel>=0.47.0",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cortext*"]

[tool.setuptools.package-data]
cortext = [
  "py.typed",
  "assets-manifest.json",
  "native/**/*",
  "models/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
